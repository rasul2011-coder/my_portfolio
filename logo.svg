<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5E10;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8860A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8A030;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- D -->
  <text x="18" y="130" font-family="Georgia, serif" font-size="120" font-weight="700"
        fill="url(#goldGrad)" letter-spacing="-8">Д</text>
  <!-- R overlapping -->
  <text x="90" y="130" font-family="Georgia, serif" font-size="100" font-weight="700"
        fill="url(#goldGrad)">Р</text>
  <!-- Decorative line -->
  <line x1="30" y1="150" x2="170" y2="150" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <!-- Name -->
  <text x="100" y="172" font-family="Georgia, serif" font-size="13" font-weight="400"
        fill="#C8860A" text-anchor="middle" letter-spacing="3">ДЖАНКОРОЗОВ</text>
  <text x="100" y="190" font-family="Georgia, serif" font-size="11" font-weight="400"
        fill="#E8A030" text-anchor="middle" letter-spacing="4">РАСУЛ</text>
</svg>
